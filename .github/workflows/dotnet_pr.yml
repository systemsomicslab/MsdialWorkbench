# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: PR Check

on:
  # No base-branch filter: stacked pull requests (based on another pull request's branch)
  # are checked on every push too, so their head is already tested when GitHub retargets
  # them to master after the pull request below merges. A retarget alone does not fire
  # pull_request with the default types.
  pull_request:
    paths-ignore:
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LGPL.txt
      - README.md
      - THIRD-PARTY-LICENSE-README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
            dotnet-version: 8.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.ReleaseVendorUnsupported.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Add package source
        run: dotnet nuget add source ${{ github.workspace }}/Assemblies
      # Master Build restores "Release vendor unsupported" in locked mode against the
      # packages.lock.ReleaseVendorUnsupported.json files. Doing the same here makes a stale
      # lock file fail the pull request rather than master. It runs before the Debug restore
      # so that the build below still uses that restore's output.
      - name: Check lock files
        run: dotnet restore /property:Configuration="Release vendor unsupported"
      - name: Restore packages
        run: dotnet restore /property:Configuration="Debug vendor unsupported"
      - name: Build
        run: dotnet build --no-restore --configuration "Debug vendor unsupported" /property:BclBuildImported=Ignore /property:DownloadLibrary=false
      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration "Debug vendor unsupported"
